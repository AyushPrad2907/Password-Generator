<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stylish Password Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ayush">
    <meta name="copyright" content="© 2025 Ayush. All rights reserved.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #6b46c1, #805ad5);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(45, 55, 72, 0.9);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease;
        }
        .container.light {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }
        label {
            margin: 10px 0 5px;
            display: block;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }
        .options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .options label {
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .password-item {
            background: #4a5568;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            animation: fadeIn 0.5s ease;
        }
        .strength {
            font-size: 14px;
            margin-top: 5px;
        }
        .strength-bar {
            height: 6px;
            width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            background: #e2e8f0;
        }
        .strength-bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .copy-btn {
            margin-top: 5px;
            padding: 6px 10px;
            background: #48bb78;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.3s;
        }
        .copy-btn:hover {
            background: #38a169;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
        .toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: #f7f7f7;
            border: none;
            border-radius: 50%;
            color: #333;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }
        .toggle-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggleBtn">🌙</button>

    <div class="container">
        <h2><i class="fas fa-key"></i> Password Generator</h2>

        <label for="name"><i class="fas fa-user"></i> Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="dob"><i class="fas fa-calendar-alt"></i> Date of Birth</label>
        <input type="date" id="dob" placeholder="YYYY-MM-DD">

        <label for="other"><i class="fas fa-info-circle"></i> Other Details</label>
        <input type="text" id="other" placeholder="Enter any other details">

        <div class="options">
            <label><input type="checkbox" id="special"> Special Characters</label>
            <label><input type="checkbox" id="numbers"> Numbers</label>
        </div>

        <button id="generateBtn"><i class="fas fa-magic"></i> Generate Passwords</button>

        <div id="passwords"></div>
        <button id="downloadBtn" style="display:none;">Download Passwords</button>

        <footer>
            &copy; 2025 Ayush. All rights reserved.
        </footer>
    </div>

    <script>
        let isDarkMode = true;

        document.getElementById('toggleBtn').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light', !isDarkMode);
            document.querySelector('.container').classList.toggle('light', !isDarkMode);
            document.getElementById('toggleBtn').textContent = isDarkMode ? '🌙' : '☀️';
        });

        function generateSinglePassword(name, dob, other, useSpecial, useNumbers) {
            let password = name.slice(0, 3) + dob.slice(-4) + other.slice(0, 2);

            if (useSpecial) {
                const specials = '!@#$%^&*';
                password += specials[Math.floor(Math.random() * specials.length)];
            }

            if (useNumbers) {
                const numbers = '0123456789';
                password += numbers[Math.floor(Math.random() * numbers.length)];
            }

            return password.split('').sort(() => 0.5 - Math.random()).join('');
        }

        function passwordStrength(pw) {
            let strength = 0;
            if (pw.length >= 8) strength++;
            if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) strength++;
            if (/[0-9]/.test(pw)) strength++;
            if (/[!@#$%^&*]/.test(pw)) strength++;

            if (strength <= 1) return { level: 'Weak', width: '33%', color: 'red' };
            if (strength === 2) return { level: 'Medium', width: '66%', color: 'yellow' };
            return { level: 'Strong', width: '100%', color: 'green' };
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function downloadPasswords(passwords) {
            const blob = new Blob([passwords], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'passwords.txt';
            link.click();
        }

        function generatePasswords() {
            const name = document.getElementById('name').value.trim();
            const dob = document.getElementById('dob').value.trim().replace(/[-/]/g, '');
            const other = document.getElementById('other').value.trim();
            const useSpecial = document.getElementById('special').checked;
            const useNumbers = document.getElementById('numbers').checked;

            if (!name || !dob) {
                document.getElementById('passwords').innerHTML = '<p>Please enter at least name and DOB.</p>';
                return;
            }

            let output = '';
            let allPasswords = '';
            for (let i = 0; i < 3; i++) {
                const pw = generateSinglePassword(name, dob, other, useSpecial, useNumbers);
                const { level, width, color } = passwordStrength(pw);
                output += `
                    <div class="password-item">
                        <div><strong>Password ${i + 1}:</strong> <span>${pw}</span></div>
                        <div class="strength">${level}</div>
                        <div class="strength-bar"><div class="fill" style="width: ${width}; background-color: ${color};"></div></div>
                        <button class="copy-btn" onclick="copyToClipboard('${pw}')"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                `;
                allPasswords += pw + '\n';
            }

            document.getElementById('passwords').innerHTML = output;
            document.getElementById('downloadBtn').style.display = 'inline-block';
            document.getElementById('downloadBtn').addEventListener('click', () => downloadPasswords(allPasswords));
        }

        document.getElementById('generateBtn').addEventListener('click', generatePasswords);
    </script>

</body>
</html>
